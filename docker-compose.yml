services:
  msviz:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8050:8050"
    volumes:
      - ./src:/app
      - ./data:/data
    command: ["python", "app.py", "serve", "--debug"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      neo4j:
        condition: service_healthy
        restart: true

  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 5
      timeout: 10s

volumes:
  neo4j_data:
  neo4j_logs: